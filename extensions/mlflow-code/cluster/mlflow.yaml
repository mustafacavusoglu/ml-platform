apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
  namespace: baklava-ai
type: Opaque
stringData:
  username: mlflow
  password: mlflow-password
  service_uri: http://mlflow:5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: baklava-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.15.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /mlflow/artifacts
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri sqlite:///mlflow/mlflow.db \
                --artifacts-destination file:///mlflow/artifacts
          env:
            - name: MLFLOW_TRACKING_USERNAME
              value: mlflow
            - name: MLFLOW_TRACKING_PASSWORD
              value: mlflow-password
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
      volumes:
        - name: mlflow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: baklava-ai
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mlflow
  namespace: baklava-ai
spec:
  to:
    kind: Service
    name: mlflow
  port:
    targetPort: http
