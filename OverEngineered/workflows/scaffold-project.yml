name: Scaffold Project

# When a new project is registered under catalog/projects/*.yaml,
# materialize projects/workloads/<name>/ from templates/ml-project.
# Idempotent: skips if the workload folder already exists.

on:
  push:
    branches: [main, master]
    paths:
      - "catalog/projects/**.yaml"
      - "catalog/projects/**.yml"
      - "templates/ml-project/**"
      - ".github/workflows/scaffold-project.yml"
      - "scripts/scaffold-project.sh"
  pull_request:
    paths:
      - "catalog/projects/**.yaml"
      - "catalog/projects/**.yml"
      - "templates/ml-project/**"
      - "scripts/scaffold-project.sh"
  workflow_dispatch:
    inputs:
      project:
        description: "Scaffold only this project name (empty = all missing)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    name: Scaffold workloads from catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the bot can push commits on main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Run scaffold
        id: scaffold
        env:
          ONLY_PROJECT: ${{ github.event.inputs.project }}
        run: |
          set -euo pipefail
          chmod +x scripts/scaffold-project.sh
          if [[ -n "${ONLY_PROJECT}" ]]; then
            ./scripts/scaffold-project.sh --project "${ONLY_PROJECT}"
          else
            ./scripts/scaffold-project.sh --all
          fi

          if [[ -n "$(git status --porcelain projects/workloads)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit scaffolded projects
        if: steps.scaffold.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/workloads
          git commit -m "chore(projects): scaffold workloads from catalog"
          git push

      - name: PR check (no auto-commit)
        if: steps.scaffold.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Catalog has projects that are not scaffolded. Run scripts/scaffold-project.sh --all and commit projects/workloads/."
          git status --porcelain projects/workloads
          exit 1

      - name: Summary
        run: |
          echo "## Scaffold project" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed: \`${{ steps.scaffold.outputs.changed }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Workloads" >> "$GITHUB_STEP_SUMMARY"
          ls -1 projects/workloads 2>/dev/null | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
