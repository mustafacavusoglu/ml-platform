name: CI Lint

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint all charts
        run: |
          set -euo pipefail
          while IFS= read -r chart; do
            echo "::group::lint $chart"
            helm lint "$chart"
            echo "::endgroup::"
          done < <(find onBoardingCharts projects/charts projects/app-of-apps templates projects/workloads -name Chart.yaml -print0 | xargs -0 -n1 dirname | sort -u)

  catalog-validate:
    name: Catalog schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Validate catalog entries
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in catalog/projects/*.yaml catalog/projects/*.yml; do
            base="$(basename "$f")"
            [[ "$base" == _* ]] && continue
            name="${base%.*}"
            kind="$(yq -r '.kind // ""' "$f")"
            meta="$(yq -r '.metadata.name // ""' "$f")"
            [[ "$kind" == "Project" ]] || { echo "bad kind in $f"; exit 1; }
            [[ "$meta" == "$name" ]] || { echo "name mismatch in $f ($meta vs $name)"; exit 1; }
            echo "ok $f"
          done
