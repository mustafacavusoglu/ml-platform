# Example: onboard a data scientist with notebook workspace
user:
  name: ada-lovelace
  email: ada@example.com
  team: research
  subjectKind: User

profile: full

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "30"
    persistentvolumeclaims: "15"
    requests.nvidia.com/gpu: "2"

workspace:
  enabled: true
  size: 50Gi

rbac:
  create: true
  roles:
    - edit
