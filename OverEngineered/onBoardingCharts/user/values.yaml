# Per-user / team onboarding defaults
# Override via: helm install alice ./onBoardingCharts/user --set user.name=alice

user:
  name: example-user
  email: ""
  team: default
  # Kubernetes subject type for RBAC binding
  subjectKind: User # User | Group | ServiceAccount

namespace:
  # Defaults to mlops-<user.name> if empty
  name: ""
  labels: {}
  annotations: {}

# ML workspace profile: notebook | training | serving | full
profile: full

resourceQuota:
  enabled: true
  # Profiles map to preset quotas; custom overrides hard below
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "50"
    persistentvolumeclaims: "10"
    requests.nvidia.com/gpu: "0"

limitRange:
  enabled: true
  default:
    cpu: "1"
    memory: 2Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi
  max:
    cpu: "4"
    memory: 8Gi

serviceAccount:
  create: true
  name: "" # defaults to mlops-workload
  annotations: {}
  # IRSA / workload identity style annotations can go here
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/mlops-user-role

rbac:
  create: true
  # Roles granted to the user in their namespace
  roles:
    - admin # admin | edit | view

networkPolicy:
  enabled: true
  allowSameNamespace: true
  allowToPlatform:
    - mlops-system
    - mlops-shared

# Persistent workspace for notebooks / artifacts (optional)
workspace:
  enabled: false
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Image pull secrets bound into the namespace
imagePullSecrets: []

# Optional: register user as Argo CD AppProject destination
argo:
  project: mlops
  createApplicationSet: false

commonLabels:
  app.kubernetes.io/part-of: mlops-platform
  app.kubernetes.io/managed-by: helm
