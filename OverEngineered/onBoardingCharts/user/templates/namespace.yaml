apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "mlops-user.namespace" . }}
  labels:
    {{- include "mlops-user.labels" . | nindent 4 }}
    mlops.platform/tier: tenant
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    mlops.platform/onboarded-by: mlops-user
    {{- if .Values.user.email }}
    mlops.platform/user-email: {{ .Values.user.email | quote }}
    {{- end }}
    {{- with .Values.namespace.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
