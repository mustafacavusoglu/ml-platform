{{- if .Values.workspace.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: {{ include "mlops-user.namespace" . }}
  labels:
    {{- include "mlops-user.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.workspace.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.workspace.size }}
  {{- if .Values.workspace.storageClass }}
  storageClassName: {{ .Values.workspace.storageClass | quote }}
  {{- end }}
{{- end }}
