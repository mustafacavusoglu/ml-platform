{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.platform.name }}-admin
  labels:
    {{- include "mlops-main.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.platform.name }}-viewer
  labels:
    {{- include "mlops-main.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.platform.name }}-admins
  labels:
    {{- include "mlops-main.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.platform.name }}-admin
subjects:
  - kind: Group
    name: {{ .Values.rbac.platformAdminGroup | quote }}
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.platform.name }}-viewers
  labels:
    {{- include "mlops-main.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.platform.name }}-viewer
subjects:
  - kind: Group
    name: {{ .Values.rbac.platformViewerGroup | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
