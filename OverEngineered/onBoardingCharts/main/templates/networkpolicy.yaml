{{- if .Values.networkPolicy.enabled }}
{{- range $key, $ns := .Values.namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-default
  namespace: {{ $ns.name }}
  labels:
    {{- include "mlops-main.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  {{- if $.Values.networkPolicy.defaultDeny }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  {{- else }}
  egress:
    - {}
  {{- end }}
{{- end }}
{{- end }}
