# Main platform onboarding defaults
platform:
  name: mlops-platform
  environment: dev # dev | staging | prod

namespaces:
  system:
    name: mlops-system
    labels:
      mlops.platform/tier: system
  shared:
    name: mlops-shared
    labels:
      mlops.platform/tier: shared
  monitoring:
    name: mlops-monitoring
    labels:
      mlops.platform/tier: monitoring

rbac:
  create: true
  platformAdminGroup: mlops-admins
  platformViewerGroup: mlops-viewers

# Resource quotas applied to system namespaces
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "200"
    persistentvolumeclaims: "50"

networkPolicy:
  enabled: true
  # Default-deny egress except DNS and platform services when true
  defaultDeny: false

# Labels / annotations stamped on all platform resources
commonLabels:
  app.kubernetes.io/part-of: mlops-platform
  app.kubernetes.io/managed-by: helm

# Image pull secrets for private registries (names only; secrets created separately)
imagePullSecrets: []

# Storage class used by platform components
storageClass: ""

# Optional: bootstrap Argo CD project for the platform
argoProject:
  create: true
  name: mlops
  description: MLOps platform applications
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
