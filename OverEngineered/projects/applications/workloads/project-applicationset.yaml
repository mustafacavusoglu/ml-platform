# ApplicationSet: one Argo Application per projects/workloads/<name>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mlops-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-platform
    mlops.platform/layer: workloads
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/example/mlops-platform.git
        revision: HEAD
        directories:
          - path: projects/workloads/*
  template:
    metadata:
      name: "proj-{{.path.basename}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: mlops-platform
        mlops.platform/project: "{{.path.basename}}"
        mlops.platform/layer: workloads
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: mlops
      source:
        repoURL: https://github.com/example/mlops-platform.git
        targetRevision: HEAD
        path: "projects/workloads/{{.path.basename}}"
        helm:
          releaseName: "proj-{{.path.basename}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "proj-{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
