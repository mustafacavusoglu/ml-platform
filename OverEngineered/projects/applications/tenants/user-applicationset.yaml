# ApplicationSet: generate per-tenant Argo Applications from Git generators
# Tenants declare values under projects/tenants/<name>/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mlops-tenants
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-platform
    mlops.platform/layer: tenants
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/example/mlops-platform.git
        revision: HEAD
        directories:
          - path: projects/tenants/*
  template:
    metadata:
      name: "tenant-{{.path.basename}}"
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: mlops-platform
        mlops.platform/tenant: "{{.path.basename}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: mlops
      source:
        repoURL: https://github.com/example/mlops-platform.git
        targetRevision: HEAD
        path: onBoardingCharts/user
        helm:
          releaseName: "user-{{.path.basename}}"
          valueFiles:
            - "../../projects/tenants/{{.path.basename}}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        # Namespace is created by the user chart itself
        namespace: "mlops-{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
