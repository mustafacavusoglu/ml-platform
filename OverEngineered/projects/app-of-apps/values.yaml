# Used when installing the root app via Helm instead of raw YAML
root:
  name: mlops-root
  namespace: argocd
  project: mlops

source:
  repoURL: https://github.com/example/mlops-platform.git
  targetRevision: HEAD
  path: projects/applications

destination:
  server: https://kubernetes.default.svc
  namespace: argocd

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
