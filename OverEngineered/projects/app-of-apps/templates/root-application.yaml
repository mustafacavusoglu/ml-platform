apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.root.name }}
  namespace: {{ .Values.root.namespace }}
  labels:
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    mlops.platform/layer: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.root.project }}
  source:
    repoURL: {{ .Values.source.repoURL | quote }}
    targetRevision: {{ .Values.source.targetRevision | quote }}
    path: {{ .Values.source.path | quote }}
    directory:
      recurse: true
      include: "{*.yaml,*.yml}"
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
