replicaCount: 1

image:
  repository: ghcr.io/mlflow/mlflow
  tag: v2.14.3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

backendStoreUri: sqlite:///mlflow/mlflow.db
defaultArtifactRoot: /mlflow/artifacts

serviceAccount:
  create: true
  name: mlflow
