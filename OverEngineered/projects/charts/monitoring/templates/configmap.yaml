{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-monitoring-placeholder
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: mlops-platform
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  status: {{ .Values.message | quote }}
  next_steps: |
    1. Install kube-prometheus-stack or your preferred operator
    2. Point projects/applications/platform/monitoring.yaml at that chart
    3. Add scrape configs for MLflow and model-serving services
{{- end }}
