replicaCount: 1

image:
  repository: ghcr.io/mlflow/mlflow
  tag: v2.14.3
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5000

persistence:
  enabled: true
  size: 10Gi
  # storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# Backend store / artifact root — use PVC paths for dev bootstrap
backendStoreUri: sqlite:///mlflow/mlflow.db
defaultArtifactRoot: /mlflow/artifacts
