# Tenant values discovered by ApplicationSet (projects/tenants/*)
user:
  name: example-user
  email: example@example.com
  team: platform-demo
  subjectKind: User

profile: full

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.nvidia.com/gpu: "0"

# Enable when a consumer pod (notebook) will mount the PVC.
# With WaitForFirstConsumer storage classes, unbound PVCs keep Argo "Progressing".
workspace:
  enabled: false
  size: 20Gi

rbac:
  create: true
  roles:
    - edit
