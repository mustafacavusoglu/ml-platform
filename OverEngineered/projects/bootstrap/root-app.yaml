# Apply once after Argo CD is available:
#   kubectl apply -f projects/bootstrap/root-app.yaml
#
# Replace repoURL with your real Git remote before applying.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-platform
    mlops.platform/layer: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    # TODO: set to your repository URL
    repoURL: https://github.com/example/mlops-platform.git
    targetRevision: HEAD
    path: projects/applications
    directory:
      recurse: true
      include: "{*.yaml,*.yml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
