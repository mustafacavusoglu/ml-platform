[project]
name = "mlops-readme-mcp"
version = "0.1.0"
description = "Python MCP server that shares weekly README snapshots from configured GitHub repositories"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    # mcp.server.mcpserver.MCPServer only exists from 2.0 on.
    "mcp[cli]>=2.0,<3",
    "PyYAML>=6.0.0",
    "uvicorn>=0.30",
]

[project.scripts]
mlops-readme-mcp = "mlops_readme_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_readme_mcp"]
