[project]
name = "mlops-readme-mcp"
version = "0.1.0"
description = "Python MCP server that shares weekly README snapshots from configured GitHub repositories"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mcp[cli]>=1.2.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
mlops-readme-mcp = "mlops_readme_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_readme_mcp"]
